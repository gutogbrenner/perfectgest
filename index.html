function ph(n,k){S.ph[n]=k;save();paint()}
function sel(j){flushSave();S.cur[S.person]=j;save();paint();updStat()}
function mv(d){flushSave();const l=LS(S.person);let i=cur(S.person);
 if(d>0){for(let k=1;k<=l.length;k++){const j=(i+k)%l.length;if(!stat(l[j])){i=j;break}if(k==l.length)i=(i+1)%l.length}}else i=(i-1+l.length)%l.length;
 S.cur[S.person]=i;save();paint()}
function mark(k){flushSave();const l0=LS(S.person),x=l0[cur(S.person)];if(!x)return;
 if(k=='depois'){openSched(x.n);return}
 const m={};
 if(stat(x)==k)S.st[x.n]='';else S.st[x.n]=k;
 m['fila/status/l'+x.n]=S.st[x.n];
 if(S.st[x.n]=='resp'){S.rd[x.n]=tkey(new Date());m['fila/rd/l'+x.n]=S.rd[x.n]}else if(S.rd[x.n]!==undefined){delete S.rd[x.n];m['fila/rd/l'+x.n]=null}
 if(S.lem[x.n]){delete S.lem[x.n];m['fila/lembretes/l'+x.n]=null}
 WM(m);saveCache();advance(x);render()}
function advance(x){const l=LS(S.person),i=cur(S.person);if(stat(x)){const j=l.findIndex((y,n)=>n>i&&!stat(y)),f=l.findIndex(y=>!stat(y));const t=j>=0?j:f;if(t>=0)S.cur[S.person]=t}save()}
document.addEventListener('keydown',e=>{if(S.tab!='call'||e.ctrlKey||e.metaKey||e.altKey||ovOpen())return;const a=document.activeElement;
 if(a&&(a.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(a.tagName)))return;const k=e.key.toUpperCase();
 const m=ST5.find(s=>K[s]==k);if(m)mark(m);else if(e.key=='ArrowRight')mv(1);else if(e.key=='ArrowLeft')mv(-1);else if(e.key=='Escape'&&S.full){S.full=false;save();paint()}});

/* ===== Meta de respostas ===== */
const DEF_META={alvo:20,ini:'2026-10-28',ate:'2026-10-30',ajuste:0};
const metaG=()=>Object.assign({},DEF_META,S.meta||{});
const tkey=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
function goalCalc(){const m=metaG(),td=tkey(new Date());
 const ids=Object.keys(S.rd).filter(id=>BY[id]&&stat(BY[id])=='resp'&&S.rd[id]>=m.ini&&S.rd[id]<=m.ate);
 const adj=+m.ajuste||0,done=ids.length+adj,hoje=ids.filter(id=>S.rd[id]==td).length;
 let dias=0;const st=new Date(Math.max(new Date(td+'T12:00').getTime(),new Date(m.ini+'T12:00').getTime())),en=new Date(m.ate+'T12:00');
 for(let d=new Date(st);d<=en;d.setDate(d.getDate()+1)){const w=d.getDay();if(w>0&&w<6)dias++}
 const wd=new Date().getDay(),util=wd>0&&wd<6&&td>=m.ini&&td<=m.ate;
 const faltam=Math.max(0,m.alvo-done),iniDia=Math.max(0,m.alvo-(done-hoje));
 const alvoHoje=util&&dias>0?Math.ceil(iniDia/dias):0,prox=dias>0?Math.ceil(faltam/dias):faltam;
 const pp={};P.forEach(p=>pp[p]={f:0,h:0});ids.forEach(id=>{const p=BY[id].p;if(pp[p]){pp[p].f++;if(S.rd[id]==td)pp[p].h++}});
 return{m,done,hoje,dias,util,faltam,alvoHoje,prox,pp,fim:td>m.ate,adj}}
const fdia=k=>{const d=new Date(k+'T12:00');return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})};
function goalBar(){const g=goalCalc(),m=g.m,pct=Math.min(100,Math.round(g.done/m.alvo*100));
 let h2;if(g.faltam==0)h2='\ud83c\udf89 Meta batida!';else if(g.fim)h2='Prazo encerrado \u00b7 faltaram '+g.faltam;else if(g.util)h2=`Hoje: <b>${g.hoje}/${g.alvoHoje}</b>${g.hoje>=g.alvoHoje?' \u2713':''}`;else h2=`Hoje \u00e9 folga \u00b7 pr\u00f3ximo dia \u00fatil: <b>${g.prox}</b>`;
 return `<div class="goal" onclick="openMeta()" title="Clique para editar a meta"><div class="gt">\ud83c\udfaf Meta: <b>${g.done}/${m.alvo}</b> respostas at\u00e9 ${esc(fdia(m.ate))} \u00b7 ${h2}${g.faltam&&!g.fim?` \u00b7 faltam <b>${g.faltam}</b> em ${g.dias} ${g.dias==1?'dia \u00fatil':'dias \u00fateis'}`:''} <span class="ge">\u270e editar</span></div><div class="gb"><i style="width:${pct}%"></i></div></div>`}
function openMeta(){const m=metaG();
 ov(`<h3>\ud83c\udfaf Meta de respostas</h3><p class="mu">Conta como resposta cada lead marcado como \u201cRespondeu a pesquisa\u201d entre as datas abaixo. Vale para toda a equipe.</p>
<label>Quantas respostas precisamos</label><input type="number" id="mg1" min="1" value="${m.alvo}">
<label>De (primeiro dia)</label><input type="date" id="mg2" value="${esc(m.ini)}"><label>At\u00e9 (\u00faltimo dia)</label><input type="date" id="mg3" value="${esc(m.ate)}">
<label>Respostas j\u00e1 feitas que n\u00e3o est\u00e3o contadas aqui (opcional)</label><input type="number" id="mg4" min="0" value="${+m.ajuste||0}"><div id="mge" class="err"></div>
<div class="ma"><button class="sv" onclick="saveMeta()">Salvar meta</button><button class="pl2" onclick="ovc()">Cancelar</button></div>`)}
function saveMeta(){const a=Math.floor(+$('mg1').value),i=$('mg2').value,e=$('mg3').value,j=Math.max(0,Math.floor(+$('mg4').value||0));
 if(!(a>=1)){$('mge').textContent='Informe quantas respostas precisamos.';return}if(!i||!e||e<i){$('mge').textContent='Confira as datas (o \u00faltimo dia n\u00e3o pode ser antes do primeiro).';return}
 S.meta={alvo:a,ini:i,ate:e,ajuste:j};W('fila/meta',clone(S.meta));saveCache();ovc();render();toast('Meta salva')}
/* ===== Ligar depois ===== */
const loc=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};
function openSched(id){const x=BY[id],ex=S.lem[id];let d=ex?new Date(ex.w):new Date(Date.now()+3600e3);if(!ex){d.setMinutes(Math.ceil(d.getMinutes()/5)*5,0,0)}
 ov(`<h3>\u23f0 Ligar depois</h3><p><b>${esc(x.e)}</b> \u00b7 ${esc(x.p)}</p><label>Dia e hor\u00e1rio da liga\u00e7\u00e3o</label><input type="datetime-local" id="sw" value="${loc(d)}">
<div class="qk"><button onclick="qs(30)">+30 min</button><button onclick="qs(60)">+1 hora</button><button onclick="qs(180)">+3 horas</button><button onclick="qs('t')">Amanh\u00e3 9h</button></div>
<label>Observa\u00e7\u00e3o (opcional)</label><input id="sn" maxlength="140" placeholder="Ex.: pediu para ligar depois do almo\u00e7o" value="${esc(ex&&ex.note||'')}"><label class="chk"><input type="checkbox" id="sg" ${S.gauto?'checked':''}> \ud83d\udcc5 Salvar tamb\u00e9m no Google Agenda${gtok?' (direto)':''}</label><div id="se" class="err"></div>
<div class="ma"><button class="sv" onclick="doSched('${id}')">Agendar</button>${ex?`<button class="pl2" onclick="unSched('${id}')">Remover agendamento</button>`:''}<button class="pl2" onclick="ovc()">Cancelar</button></div>`)}
function qs(m){const d=new Date();if(m=='t'){d.setDate(d.getDate()+1);d.setHours(9,0,0,0)}else d.setMinutes(d.getMinutes()+m,0,0);$('sw').value=loc(d)}
function doSched(id){const v=$('sw').value;if(!v){$('se').textContent='Escolha o dia e o hor\u00e1rio.';return}const dt=new Date(v);if(isNaN(dt)){$('se').textContent='Data inv\u00e1lida.';return}
 if(dt.getTime()<Date.now()-60000){$('se').textContent='Esse hor\u00e1rio j\u00e1 passou. Escolha um hor\u00e1rio futuro.';return}
 const x=BY[id],note=$('sn').value.trim(),lem={w:dt.toISOString(),by:x.p};if(note)lem.note=note;if(S.lem[id]&&S.lem[id].gev)lem.gev=S.lem[id].gev;
 S.st[id]='depois';S.lem[id]=lem;delete S.al[id];
 WM({['fila/status/l'+id]:'depois',['fila/lembretes/l'+id]:lem});saveCache();
 try{if('Notification' in window&&Notification.permission=='default')Notification.requestPermission()}catch(e){}
 if(LS(S.person)[cur(S.person)]===x)advance(x);else save();
 const g=$('sg')&&$('sg').checked;S.gauto=!!g;save();ovc();render();toast('Agendado para '+fmtL(lem.w));if(g)gcal(id)}
function unSched(id){const x=BY[id],old=S.lem[id];if(old&&old.gev&&gtok)gapiDel(old.gev);delete S.lem[id];const m={['fila/lembretes/l'+id]:null};if(stat(x)=='depois'){S.st[id]='';m['fila/status/l'+id]=''}
 WM(m);saveCache();ovc();render()}
function snooze(id,min){const m=S.lem[id];if(!m)return;const lem=Object.assign({},m,{w:new Date(Date.now()+min*60000).toISOString()});S.lem[id]=lem;delete S.al[id];WM({['fila/lembretes/l'+id]:lem});saveCache();ovc();render()}
function gotoLead(id){const x=BY[id];if(!x)return;flushSave();S.person=x.p;S.tab='call';S.cur[x.p]=LS(x.p).indexOf(x);save();ovc();render()}
let flashTm=null,oldTitle=document.title;
function stopFlash(){if(flashTm){clearInterval(flashTm);flashTm=null;document.title=oldTitle}}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.18,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.2);o.start(a.currentTime+t);o.stop(a.currentTime+t+.22)})}catch(e){}}
function dueList(){const now=Date.now();return Object.keys(S.lem).filter(id=>{const m=S.lem[id],x=BY[id];return x&&stat(x)=='depois'&&x.p==S.person&&new Date(m.w).getTime()<=now})}
function checkDue(){if(!$('ov')||document.getElementById('lock'))return;badges();if(ovOpen())return;const due=dueList().filter(id=>S.al[id]!==S.lem[id].w);if(!due.length)return;
 due.forEach(id=>S.al[id]=S.lem[id].w);save();
 ov(`<h3>\u23f0 Hora de ligar</h3>${due.map(id=>{const x=BY[id],m=S.lem[id];return `<div class="dl"><div><b>${esc(x.e)}</b><div class="mu">${esc(x.r||'')} \u00b7 ${esc(x.t1||'')}</div><div class="mu">Agendado para ${esc(fmtL(m.w))}${m.note?' \u00b7 '+esc(m.note):''}</div></div><div class="ma"><button class="sv" onclick="gotoLead('${id}')">\ud83d\udcde Abrir lead</button><button class="pl2" onclick="snooze('${id}',10)">Adiar 10 min</button></div></div>`}).join('')}<div class="ma"><button class="pl2" onclick="ovc()">Fechar</button></div>`);
 beep();try{if('Notification' in window&&Notification.permission=='granted'){const x=BY[due[0]];new Notification('\u23f0 Hora de ligar',{body:x.e+(due.length>1?' e mais '+(due.length-1):'')})}}catch(e){}
 if(!flashTm){let t=0;flashTm=setInterval(()=>{document.title=(t++%2)?oldTitle:'\u23f0 Hora de ligar!'},900)}}
setInterval(checkDue,15000);
/* ===== Agendadas ===== */
function sched(){const f=S.lf||'all',now=Date.now();
 const ids=Object.keys(S.lem).filter(id=>BY[id]&&stat(BY[id])=='depois'&&(f=='all'||BY[id].p==f)).sort((a,b)=>new Date(S.lem[a].w)-new Date(S.lem[b].w));
 const notif='Notification' in window?Notification.permission:'denied';
 const gm=gmailOf();
 $('body').innerHTML=`<div class="card" style="margin-bottom:16px"><b>\ud83d\udcc5 Google Agenda</b><div class="mu" style="font-size:13px;margin:4px 0 10px">Salve as liga\u00e7\u00f5es agendadas na agenda do seu e-mail, j\u00e1 com dia e hor\u00e1rio combinados, telefone, respons\u00e1vel, segmento, CNPJ, site e a observa\u00e7\u00e3o.</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><label class="pf" style="flex:1;min-width:240px">E-mail do Google<input id="gml" type="email" style="width:100%;text-align:left;font-weight:500" value="${esc(gm)}" placeholder="voce@gmail.com" ${AUSER?'disabled':''} onchange="S.gmail=this.value.trim();save()"></label>
${auth?(gtok?'<span class="mu">\u2713 Conectado \u2014 salva direto na agenda</span>':'<button class="sv alt" onclick="gLogin(true)">\ud83d\udd17 Conectar para salvar direto</button>'):''}
<button class="sv alt" onclick="icsAll()" ${ids.length?'':'disabled'}>\u2b07 Baixar todas (.ics)</button></div>
<label class="chk"><input type="checkbox" ${S.gauto?'checked':''} onchange="S.gauto=this.checked;save()"> Ao agendar uma liga\u00e7\u00e3o, salvar no Google Agenda automaticamente</label>
<div class="mu" style="font-size:12px;margin-top:6px">Sem \u201cConectar\u201d, o bot\u00e3o \ud83d\udcc5 abre o Google Agenda com o evento preenchido, s\u00f3 falta confirmar. Com \u201cConectar\u201d, o evento \u00e9 criado direto (com lembrete de 10 min).</div></div>
<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px"><div class="seg"><button class="${f=='all'?'on':''}" onclick="S.lf='all';save();paint()">Todos</button>${P.map(n=>`<button class="${f==n?'on':''}" onclick="S.lf='${n}';save();paint()">${n}</button>`).join('')}</div>
${notif=='default'?'<button class="sv" onclick="Notification.requestPermission().then(()=>paint())">\ud83d\udd14 Ativar notifica\u00e7\u00f5es do navegador</button>':notif=='granted'?'<span class="mu">\ud83d\udd14 Notifica\u00e7\u00f5es do navegador ativadas</span>':'<span class="mu">Os avisos aparecem aqui na tela com som (mantenha esta aba aberta).</span>'}</div>
${ids.length?`<div class="card ov"><table class="tl"><tr><th>Quando</th><th>Lead</th><th>Atendente</th><th>Telefone</th><th>Observa\u00e7\u00e3o</th><th></th></tr>${ids.map(id=>{const x=BY[id],m=S.lem[id],late=new Date(m.w).getTime()<=now;return `<tr class="${late?'late':''}"><td>${late?'<b style="color:#f2564f">Atrasada \u00b7 </b>':''}${esc(fmtL(m.w))}</td><td>${esc(x.e)}<div class="mu">${esc(x.r||'')}</div></td><td>${esc(x.p)}</td><td>${esc(x.t1||'')}</td><td>${esc(m.note||'\u2014')}</td><td style="white-space:nowrap"><button class="mini" onclick="gcal('${id}')">\ud83d\udcc5 Agenda${m.gev?' \u2713':''}</button> <button class="mini" onclick="icsOne('${id}')">.ics</button> <button class="mini" onclick="gotoLead('${id}')">Abrir</button> <button class="mini" onclick="openSched('${id}')">Reagendar</button> <button class="mini" onclick="unSched('${id}')">Remover</button></td></tr>`}).join('')}</table></div>`:'<div class="card mu">Nenhuma liga\u00e7\u00e3o agendada. Na aba Liga\u00e7\u00f5es, use o bot\u00e3o <b>Ligar depois</b> para marcar dia e hor\u00e1rio.</div>'}`}
/* ===== Google Agenda ===== */
const p2=n=>String(n).padStart(2,'0');
const gcd=d=>d.getUTCFullYear()+p2(d.getUTCMonth()+1)+p2(d.getUTCDate())+'T'+p2(d.getUTCHours())+p2(d.getUTCMinutes())+p2(d.getUTCSeconds())+'Z';
function evInfo(id){const x=BY[id],m=S.lem[id],st=new Date(m.w),en=new Date(st.getTime()+15*60000);
 const L2=[];const add=(k,v)=>{if(v&&String(v).trim())L2.push(k+': '+String(v).trim())};
 add('Telefone',x.t1);add('Telefone 2',x.t2);add('Respons\u00e1vel',x.r);add('Segmento',x.s);add('Porte',x.tp);add('Faturamento',x.f);add('Funcion\u00e1rios',x.fu);add('Cidade','Caxias do Sul'+(x.cep?' \u00b7 '+x.cep:''));add('CNPJ',x.cnpj);add('Site',x.si);add('Instagram',x.ig);add('E-mail',x.em);
 if(m.note)L2.unshift('Combinado: '+m.note);L2.push('Atendente: '+x.p);L2.push('Agendado no CRM PS J\u00fanior para '+fmtL(m.w));
 return{title:'\ud83d\udcde Ligar: '+x.e+(x.r&&x.r!=x.e?' ('+x.r+')':''),details:L2.join('\n').slice(0,1600),s:st,e:en,loc:x.t1||''}}
function gcalUrl(id){const v=evInfo(id),q=new URLSearchParams({action:'TEMPLATE',text:v.title,dates:gcd(v.s)+'/'+gcd(v.e),details:v.details});const u=gmailOf();if(u)q.set('authuser',u);return 'https://calendar.google.com/calendar/render?'+q.toString()}
function gtokOk(){if(gtok&&gtok.e<=Date.now()){gtok=null;try{sessionStorage.removeItem('psj_gt')}catch(e){}}return !!gtok}
async function gapiSave(id){const v=evInfo(id),m=S.lem[id];
 const body={summary:v.title,description:v.details,start:{dateTime:v.s.toISOString()},end:{dateTime:v.e.toISOString()},reminders:{useDefault:false,overrides:[{method:'popup',minutes:10}]}};
 const base='https://www.googleapis.com/calendar/v3/calendars/primary/events';
 let r=await fetch(m.gev?base+'/'+encodeURIComponent(m.gev):base,{method:m.gev?'PATCH':'POST',headers:{Authorization:'Bearer '+gtok.t,'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(r.status==404&&m.gev){delete m.gev;r=await fetch(base,{method:'POST',headers:{Authorization:'Bearer '+gtok.t,'Content-Type':'application/json'},body:JSON.stringify(body)})}
 if(r.status==401||r.status==403){gtok=null;try{sessionStorage.removeItem('psj_gt')}catch(e){}throw new Error(r.status==403?'sem permiss\u00e3o na agenda (ative a Google Calendar API e conecte de novo)':'conex\u00e3o com o Google expirou \u2014 clique em Conectar de novo')}
 if(!r.ok)throw new Error('erro '+r.status);const j=await r.json();
 const lem=Object.assign({},S.lem[id],{gev:j.id});S.lem[id]=lem;WM({['fila/lembretes/l'+id]:lem});saveCache();return j}
async function gapiDel(ev){try{await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events/'+encodeURIComponent(ev),{method:'DELETE',headers:{Authorization:'Bearer '+gtok.t}})}catch(e){}}
function gcal(id){if(!S.lem[id])return;
 if(gtokOk()){toast('Salvando no Google Agenda\u2026');gapiSave(id).then(()=>{toast('Salvo no Google Agenda \u2713');if(S.tab=='sched')paint()}).catch(e=>{toast('Agenda: '+e.message);if(S.tab=='sched')paint()});return}
 const w=window.open(gcalUrl(id),'_blank','noopener');if(!w)toast('O navegador bloqueou a janela. Permita pop-ups para abrir o Google Agenda.')}
const icsT=t=>String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsFold=l=>{const a=Array.from(l);let o='';while(a.length>60){o+=a.splice(0,60).join('')+'\r\n '}return o+a.join('')};
function icsEv(id){const v=evInfo(id);return['BEGIN:VEVENT','UID:psj-'+id+'@crm-psjunior','DTSTAMP:'+gcd(new Date()),'DTSTART:'+gcd(v.s),'DTEND:'+gcd(v.e),'SUMMARY:'+icsT(v.title),'DESCRIPTION:'+icsT(v.details),'BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:'+icsT(v.title),'END:VALARM','END:VEVENT'].map(icsFold).join('\r\n')}
function icsFile(ids,name){dl(new Blob(['BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//PS Junior//CRM//PT\r\nCALSCALE:GREGORIAN\r\n'+ids.map(icsEv).join('\r\n')+'\r\nEND:VCALENDAR\r\n'],{type:'text/calendar;charset=utf-8'}),name);toast('Arquivo de agenda baixado (.ics)')}
function icsOne(id){if(S.lem[id])icsFile([id],'ligar-'+id+'.ics')}
function icsAll(){const f=S.lf||'all';const ids=Object.keys(S.lem).filter(id=>BY[id]&&stat(BY[id])=='depois'&&(f=='all'||BY[id].p==f));if(ids.length)icsFile(ids,'ligacoes-agendadas-'+today()+'.ics')}
/* ===== Respostas salvas (todas e apenas as salvas) ===== */

async function restoreBackup(file){if(!file)return;let o;try{o=JSON.parse(await file.text());if(!o||typeof o!='object'||!(o.status||o.respostas||o.importados||o.roteiro))throw 0}catch(e){toast('Arquivo de backup inv\u00e1lido');return}
 const nr=Object.keys(o.respostas||{}).length,ns=Object.keys(o.status||{}).length;
 ask(`Restaurar este backup (${ns} status, ${nr} leads com respostas, ${Object.keys(o.importados||{}).length} leads importados)?`,()=>{const m={};
  if(o.meta)m['fila/meta']=o.meta;
  ['status','respostas','salvo','lembretes','importados','lotes','rd'].forEach(k=>Object.keys(o[k]||{}).forEach(id=>m['fila/'+k+'/'+id]=o[k][id]));
  if(o.roteiro&&o.roteiro.length)m['fila/roteiro']=o.roteiro;
  WM(m);Object.assign(S.st,unk(o.status));Object.assign(S.ans,unk(o.respostas));Object.assign(S.sv,unk(o.salvo));Object.assign(S.lem,unk(o.lembretes));Object.assign(S.rd,unk(o.rd));if(o.meta)S.meta=o.meta;Object.assign(S.imp,o.importados||{});Object.assign(S.lotes,o.lotes||{});if(o.roteiro&&o.roteiro.length)S.script=o.roteiro;saveCache();build();
  render();toast('Backup restaurado')})}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)},k,b64(ENC.c))))}
let unlocked=false;
async function unlock(pw,silent){if(unlocked)return;if(!window.crypto||!crypto.subtle){$('lerr').textContent='Abra o site por https (ou localhost).';return}
 try{D=await dec(pw)}catch(e){try{sessionStorage.removeItem('psj_pw')}catch(_){}if(!silent)$('lerr').textContent='Senha incorreta.';return}
 if(unlocked)return;unlocked=true;try{sessionStorage.setItem('psj_pw',pw)}catch(e){}
 $('lock').remove();build();Object.keys(S.dr).forEach(id=>DIRTY[id]=1);flushSave();render();paintUser();authInit();setTimeout(checkDue,800)}
